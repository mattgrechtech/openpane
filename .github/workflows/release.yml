name: Release

# A version tag (v0.1.0) builds a signed APK and attaches it to a draft GitHub release.
# Needs the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD
# (see docs/build-setup.md). The draft is published by hand after a check on a TV.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match appVersion $version"; exit 1; }
      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          TVKIOSK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TVKIOSK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TVKIOSK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export TVKIOSK_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew test assembleRelease
          rm "$RUNNER_TEMP/release.jks"
          cp app/build/outputs/apk/release/app-release.apk "openpane-$GITHUB_REF_NAME.apk"
          sha256sum "openpane-$GITHUB_REF_NAME.apk" > "openpane-$GITHUB_REF_NAME.apk.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            openpane-${{ github.ref_name }}.apk
            openpane-${{ github.ref_name }}.apk.sha256
