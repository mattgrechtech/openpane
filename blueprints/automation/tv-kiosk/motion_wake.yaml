blueprint:
  name: Motion or presence → wake TV Kiosk
  description: >-
    Wakes a TV running TV Kiosk when your sensors see someone, and lets it rest again when the room
    is clear. Motion sensors and presence sensors (mmWave) both work: while a presence sensor stays
    on, the screen stays awake.


    Set "Rest the screen after" in TV Kiosk's settings (Screen → Wake on motion) for how long the
    screen waits before going dark. On a TV, keep the TV itself out of standby (turn off its sleep
    timer): most TVs drop off the network in standby, so nothing can wake them. Only for a TV that
    stays reachable in standby, pick its media player and this switches it on first.


    Needs the TV's `rest_command` from the TV Kiosk docs (docs/home-assistant.md, Option A).
  domain: automation
  source_url: https://github.com/mattgrechtech/ha-tv-kiosk/blob/main/blueprints/automation/tv-kiosk/motion_wake.yaml
  input:
    sensors:
      name: Motion or presence sensors
      description: Binary sensors (motion, occupancy, presence) or event entities (a camera's motion event).
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
            - domain: event
    kiosk_command:
      name: TV Kiosk rest_command
      description: The name after "rest_command.", for example tv_kiosk_living_room.
      selector:
        text:
    tv:
      name: TV power (optional)
      description: The TV's media player. If it's off, it's switched on first. Leave empty if the TV stays on.
      default: ""
      selector:
        entity:
          filter:
            - domain: media_player
    page:
      name: Page to show (optional)
      description: A Home Assistant path to open on wake, for example /lovelace/cameras. Empty keeps the current page.
      default: ""
      selector:
        text:
    turn_off_minutes:
      name: Switch the TV off after the room is clear (minutes)
      description: 0 never switches it off. Needs "TV power". The TV is only switched off if TV Kiosk is in front.
      default: 0
      selector:
        number: { min: 0, max: 240, unit_of_measurement: min }

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input sensors
    not_from: [unavailable, unknown]
    not_to: [unavailable, unknown]

variables:
  sensors: !input sensors
  command: !input kiosk_command
  tv: !input tv
  page: !input page
  turn_off_minutes: !input turn_off_minutes
  is_event: "{{ trigger.to_state.domain == 'event' }}"
  seen: "{{ is_event or trigger.to_state.state == 'on' }}"
  # Presence is held while any binary sensor in the list is on.
  anyone: >-
    {{ sensors | select('match', '^binary_sensor\.') | select('is_state', 'on') | list | count > 0 }}

actions:
  - choose:
      - alias: Someone seen
        conditions: "{{ seen }}"
        sequence:
          - if: "{{ tv != '' and states(tv) in ['off', 'standby'] }}"
            then:
              - action: media_player.turn_on
                target: { entity_id: "{{ tv }}" }
                continue_on_error: true
              - wait_template: "{{ states(tv) not in ['off', 'standby', 'unavailable'] }}"
                timeout: "00:00:30"
          # TV Kiosk may still be starting after the TV comes on: try for up to 30 seconds.
          - repeat:
              sequence:
                - action: "rest_command.{{ command }}"
                  data:
                    command: motion
                    args: "{{ {} if is_event else {'present': true} }}"
                  response_variable: reply
                  continue_on_error: true
                - if: "{{ (reply.status | default(0)) != 200 }}"
                  then:
                    - delay: "00:00:03"
              until: "{{ (reply.status | default(0)) == 200 or repeat.index >= 10 }}"
          - if: "{{ page != '' }}"
            then:
              - action: "rest_command.{{ command }}"
                data:
                  command: navigate
                  args: { path: "{{ page }}" }
                continue_on_error: true
      - alias: Room clear
        conditions: "{{ not seen and not anyone }}"
        sequence:
          - action: "rest_command.{{ command }}"
            data:
              command: motion
              args: { present: false }
            continue_on_error: true
          - if: "{{ tv != '' and (turn_off_minutes | int) > 0 }}"
            then:
              # New motion restarts this automation, which cancels the wait.
              - delay: { minutes: "{{ turn_off_minutes | int }}" }
              - action: "rest_command.{{ command }}"
                data:
                  command: state
                response_variable: kiosk
                continue_on_error: true
              - if: "{{ (kiosk.content.dashboard_visible | default(false)) and states(tv) not in ['off', 'standby'] }}"
                then:
                  - action: media_player.turn_off
                    target: { entity_id: "{{ tv }}" }
